function entriesFrom(data,word,edition){
 if(!data)return[];
 if(Array.isArray(data))return data.flatMap(x=>entriesFrom(x,word,edition));
 if(typeof data!=='object')return[];
 if(Array.isArray(data.entries))return data.entries;
 if(Array.isArray(data.results))return data.results.flatMap(x=>entriesFrom(x,word,edition));
 if(Array.isArray(data.items))return data.items.flatMap(x=>entriesFrom(x,word,edition));
 if(Array.isArray(data.definitions)){
  const defs=data.definitions;
  const senseLike=defs.some(x=>x&&('glosses'in x||'raw_glosses'in x||'examples'in x||'tags'in x));
  if(senseLike)return [{word:data.word||word,lang:data.lang||'German',lang_code:data.lang_code||'de',pos:data.pos||'',senses:defs,translations:data.translations||[],edition}];
  return defs.flatMap(x=>entriesFrom(x,word,edition));
 }
 if(Array.isArray(data.senses))return [{word:data.word||word,lang:data.lang||'German',lang_code:data.lang_code||'de',pos:data.pos||'',senses:data.senses,translations:data.translations||[],edition}];
 if(data.entry&&typeof data.entry==='object')return entriesFrom(data.entry,word,edition);

}
function collectTranslations(value,out=[],seen=new Set()){if(!value)return out;if(Array.isArray(value)){value.forEach(v=>collectTranslations(v,out,seen));return out}if(typeof value!=='object')return out;const code=String(value.lang_code||value.code||value.language_code||'').toLowerCase(),lang=String(value.lang||value.language||'').toLowerCase();if(['bn','ben'].includes(code)||['bengali','bangla'].includes(lang)){const text=String(value.word||value.translation||value.term||value.text||'').trim();if(text&&!seen.has(text)){seen.add(text);out.push(text)}}Object.entries(value).forEach(([k,v])=>{if(k!=='examples')collectTranslations(v,out,seen)});return out}
function normalizeSenses(entry){let senses=Array.isArray(entry.senses)?entry.senses:[];return senses.map(s=>{const g=s.glosses||s.raw_glosses||s.definitions||[];const glosses=(Array.isArray(g)?g:[g]).filter(x=>typeof x==='string'&&x.trim());return{glosses,translations:collectTranslations(s.translations||s.translation||[]),examples:Array.isArray(s.examples)?s.examples:[],tags:Array.isArray(s.tags)?s.tags:[]}}).filter(s=>s.glosses.length||s.translations.length)}
async function translateToBangla(text,sourceLang){if(!text)return '';const query=String(text).trim().slice(0,450),source=sourceLang||'de';if(!query)return '';try{const p=new URLSearchParams({q:query,langpair:source+'|bn'});const r=await fetch('https://api.mymemory.translated.net/get?'+p.toString(),{signal:AbortSignal.timeout(4500)});if(r.ok){const d=await r.json();if(Number(d.responseStatus)===200){const t=String(d.responseData&&d.responseData.translatedText||'').trim();if(t&&t.toLowerCase()!==query.toLowerCase()&&!/MYMEMORY WARNING|PLEASE SELECT/i.test(t))return t}}}catch(e){}try{const p=new URLSearchParams({client:'gtx',sl:source,tl:'bn',dt:'t',q:query});const r=await fetch('https://translate.googleapis.com/translate_a/single?'+p.toString(),{signal:AbortSignal.timeout(4500)});if(!r.ok)return '';const d=await r.json();const t=Array.isArray(d)&&Array.isArray(d[0])?d[0].map(x=>Array.isArray(x)?x[0]||'':'').join('').trim():'';return t&&t.toLowerCase()!==query.toLowerCase()?t:''}catch(e){return ''}}
