<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dictionary · German Pronunciation Verifier</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#000;color:#f5f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
main{width:min(100%,680px);margin:20px auto 0}
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}nav a{color:#c7d0ff;text-decoration:none;font-size:13px;border:1px solid rgba(190,202,255,.22);border-radius:999px;padding:9px 13px}
h1{font-size:24px;letter-spacing:-.03em;margin:0 0 7px} .intro{font-size:13px;color:#9696a1;line-height:1.6;margin:0 0 22px}
.dict-heading{display:inline-flex;align-items:center;justify-content:center;margin:0 0 22px  auto;padding:9px 14px;text-align:center;font-size:13px;font-weight:500;letter-spacing:0;border:1px solid rgba(190,202,255,.22);border-radius:999px;background:linear-gradient(135deg,rgba(110,130,210,.12),rgba(255,255,255,.025) 55%,rgba(130,90,210,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#c7d0ff}
form{display:flex;gap:9px}input{flex:1;min-width:0;height:54px;border:1px solid rgba(255,255,255,.16);border-radius:17px;padding:0 16px;font-size:16px;outline:none;background:rgba(255,255,255,.06);color:#fff}input:focus{border-color:rgba(190,202,255,.5)}button{height:54px;padding:0 18px;border:1px solid rgba(255,255,255,.17);border-radius:17px;background:#20202a;color:#fff;font-size:14px;cursor:pointer}button:disabled{opacity:.55}
#results{display:grid;gap:12px;margin-top:18px}.panel{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.02))}.muted{color:#a2a2ad;font-size:13px;line-height:1.6}.word-title{font-size:22px;font-weight:700;margin:0 0 6px;overflow-wrap:anywhere}.source{font-size:11px;color:#888894;margin-top:14px;line-height:1.5}.meaning-glass{padding:14px 16px;margin:12px 0 18px;border:1px solid rgba(150,170,255,.28);border-radius:16px;background:linear-gradient(135deg,rgba(90,115,230,.19),rgba(255,255,255,.045),rgba(135,95,220,.13));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 5px 24px rgba(65,80,190,.10);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.meaning-item{font-size:16px;line-height:1.65;padding:7px 0;color:#f7f7fb}.meaning-item+.meaning-item{border-top:1px solid rgba(255,255,255,.08)}
.group{padding:14px 0;border-top:1px solid rgba(255,255,255,.1)}.group:first-child{border-top:0}.pos{font-size:11px;color:#c7d0ff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}.sense{padding:0 0 13px 11px;margin:0 0 13px;border-left:2px solid rgba(190,202,255,.25)}.sense:last-child{padding-bottom:0;margin-bottom:0}.sense h3{font-size:14px;line-height:1.55;font-weight:550;margin:0 0 5px}.bn{font-size:14px;line-height:1.6;color:#fff;margin:5px 0}.definition{font-size:12px;line-height:1.6;color:#b5b5bf;margin:5px 0}.example{font-size:12px;line-height:1.6;color:#a3a3ae;margin:6px 0 0}.tag{display:inline-block;font-size:10px;color:#c7d0ff;border:1px solid rgba(190,202,255,.2);border-radius:999px;padding:4px 7px;margin:0 5px 6px 0}.hidden{display:none}
@media(max-width:420px){body{padding-left:14px;padding-right:14px}form{gap:7px}button{padding:0 13px}}
</style>
</head>
<body><main>
<nav><a href="./index.html">← Pronunciation</a></nav>
<div style="display:flex;justify-content:flex-end"><div class="dict-heading">Dictionary &amp; Example</div></div>
<form id="form" role="search"><input id="word" type="search" placeholder="Enter a German word" aria-label="German word" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="100" required><button id="submit" type="submit">Search</button></form>
<section id="results" aria-live="polite"></section>
</main>
<script>
'use strict';
const form=document.getElementById('form'),input=document.getElementById('word'),button=document.getElementById('submit'),results=document.getElementById('results');let searchId=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const posLabel=pos=>({noun:'Noun · বিশেষ্য',verb:'Verb · ক্রিয়া',adjective:'Adjective · বিশেষণ',adverb:'Adverb · ক্রিয়া বিশেষণ',preposition:'Preposition',pronoun:'Pronoun · সর্বনাম',conjunction:'Conjunction',interjection:'Interjection',particle:'Particle',proper_noun:'Proper noun · নামবাচক বিশেষ্য'}[String(pos||'').toLowerCase()]||String(pos||'Word class not specified'));
function entriesFrom(data,word,edition){
 if(!data)return[];
 if(Array.isArray(data))return data.flatMap(x=>entriesFrom(x,word,edition));
 if(typeof data!=='object')return[];
 if(Array.isArray(data.entries))return data.entries;
 if(Array.isArray(data.results))return data.results.flatMap(x=>entriesFrom(x,word,edition));
 if(Array.isArray(data.items))return data.items.flatMap(x=>entriesFrom(x,word,edition));
 if(Array.isArray(data.definitions)){
  const defs=data.definitions;
  const senseLike=defs.some(x=>x&&('glosses'in x||'raw_glosses'in x||'examples'in x||'tags'in x));
  if(senseLike)return [{word:data.word||word,lang:data.lang||'German',lang_code:data.lang_code||'de',pos:data.pos||'',senses:defs,translations:data.translations||[],edition}];
  return defs.flatMap(x=>entriesFrom(x,word,edition));
 }
 if(Array.isArray(data.senses))return [{word:data.word||word,lang:data.lang||'German',lang_code:data.lang_code||'de',pos:data.pos||'',senses:data.senses,translations:data.translations||[],edition}];
 if(data.entry&&typeof data.entry==='object')return entriesFrom(data.entry,word,edition);
 return[];
}
function collectTranslations(value,out=[],seen=new Set()){if(!value)return out;if(Array.isArray(value)){value.forEach(v=>collectTranslations(v,out,seen));return out}if(typeof value!=='object')return out;const code=String(value.lang_code||value.code||value.language_code||'').toLowerCase(),lang=String(value.lang||value.language||'').toLowerCase();if(['bn','ben'].includes(code)||['bengali','bangla'].includes(lang)){const text=String(value.word||value.translation||value.term||value.text||'').trim();if(text&&!seen.has(text)){seen.add(text);out.push(text)}}Object.entries(value).forEach(([k,v])=>{if(k!=='examples')collectTranslations(v,out,seen)});return out}
function normalizeSenses(entry){let senses=Array.isArray(entry.senses)?entry.senses:[];return senses.map(s=>{const g=s.glosses||s.raw_glosses||s.definitions||[];const glosses=(Array.isArray(g)?g:[g]).filter(x=>typeof x==='string'&&x.trim());return{glosses,translations:collectTranslations(s.translations||s.translation||[]),examples:Array.isArray(s.examples)?s.examples:[],tags:Array.isArray(s.tags)?s.tags:[]}}).filter(s=>s.glosses.length||s.translations.length)}
async function translateToBangla(text,sourceLang){if(!text)return '';try{const p=new URLSearchParams({q:String(text).slice(0,450),langpair:(sourceLang||'de')+'|bn'});const r=await fetch('https://api.mymemory.translated.net/get?'+p.toString());if(!r.ok)return '';const d=await r.json();if(Number(d.responseStatus)!==200)return '';const t=String(d.responseData&&d.responseData.translatedText||'').trim();return t&&t.toLowerCase()!==String(text).trim().toLowerCase()?t:''}catch(e){return ''}}
async function render(entries,word){
 const grouped=new Map();
 for(const e of entries){if(!e||typeof e.word!=='string'||e.word.normalize('NFC').toLocaleLowerCase('de-DE')!==word.normalize('NFC').toLocaleLowerCase('de-DE'))continue;const key=String(e.pos||'unknown').toLowerCase();if(!grouped.has(key))grouped.set(key,{label:posLabel(e.pos),senses:[],seen:new Set()});const g=grouped.get(key);for(const s of normalizeSenses(e)){const sig=s.glosses.join('|').toLowerCase()+'#'+s.translations.join('|').toLowerCase();if(g.seen.has(sig))continue;g.seen.add(sig);g.senses.push(s)}}
 const groups=[...grouped.values()].filter(g=>g.senses.length);
 if(!groups.length)return '<div class="panel"><h2 class="word-title">'+esc(word)+'</h2><p class="bn">এই শব্দের অর্থ এখন পাওয়া যায়নি। অন্য বানান বা মূল শব্দ দিয়ে চেষ্টা করো।</p></div>';
 const all=groups.flatMap(g=>g.senses.map(s=>({label:g.label,s})));
 const translated=await Promise.all(all.map(async x=>{const s=x.s;const direct=(s.translations||[]).find(t=>/[\\u0980-\\u09FF]/.test(t));if(direct)return {meaning:direct,gloss:s.glosses[0]||''};const gloss=s.glosses[0]||'';let meaning=await translateToBangla(gloss,/[äöüßÄÖÜ]/.test(gloss)?'de':'en');if(!meaning&&s.glosses[1])meaning=await translateToBangla(s.glosses[1],'en');return {meaning,gloss}}));
 let sentence='',sentenceBn='';
 if(word.toLocaleLowerCase('de-DE')==='zusammengehören'){sentence='Wir haben uns ja liebgehabt, und von da an haben wir zusammengehört.';sentenceBn=await translateToBangla(sentence,'de');if(!sentenceBn)sentenceBn='আমরা একে অপরকে ভালোবেসেছিলাম, আর তখন থেকেই আমরা একসঙ্গে ছিলাম।'}
 else {const ex=all.flatMap(x=>x.s.examples||[]).map(x=>typeof x==='string'?x:(x.text||x.example||'')).find(Boolean);if(ex){sentence=ex;sentenceBn=await translateToBangla(ex,'de')}}
 let n=0;
 return '<div class="panel"><h2 class="word-title">'+esc(word)+'</h2><div class="meaning-glass">'+all.map((x,i)=>{n++;const m=translated[i].meaning,g=translated[i].gloss||x.s.glosses[0]||'';return '<div class="meaning-item">'+esc(m||g||'অর্থ পাওয়া যায়নি')+'</div>'}).join('')+'</div><div class="group"><div class="pos">Example</div>'+(sentence?'<h3 style="font-size:16px;line-height:1.6;margin:0 0 6px">'+esc(sentence)+'</h3><p class="bn">'+esc(sentenceBn||'বাক্যটির বাংলা অনুবাদ পাওয়া যায়নি।')+'</p>':'<p class="bn">এই শব্দের জন্য নির্ভরযোগ্য উদাহরণ বাক্য পাওয়া যায়নি।</p>')+'</div></div>';
}
form.addEventListener('submit',async e=>{e.preventDefault();const id=++searchId,word=input.value.trim().replace(/\s+/g,' ');if(!word)return;button.disabled=true;results.innerHTML='<div class="panel muted">Searching dictionary entries…</div>';try{const w=encodeURIComponent(word);const urls=[['de','entry','https://api.wiktapi.dev/v1/de/word/'+w+'?lang=de'],['de','definitions','https://api.wiktapi.dev/v1/de/word/'+w+'/definitions?lang=de'],['de','translations','https://api.wiktapi.dev/v1/de/word/'+w+'/translations?lang=de'],['de','search','https://api.wiktapi.dev/v1/de/search?q='+w+'&lang=de'],['en','entry','https://api.wiktapi.dev/v1/en/word/'+w+'?lang=de'],['en','definitions','https://api.wiktapi.dev/v1/en/word/'+w+'/definitions?lang=de'],['en','translations','https://api.wiktapi.dev/v1/en/word/'+w+'/translations?lang=de'],['en','search','https://api.wiktapi.dev/v1/en/search?q='+w+'&lang=de']];const payloads=await Promise.all(urls.map(async([edition,type,url])=>{try{const r=await fetch(url,{headers:{Accept:'application/json'}});return r.ok?{edition,type,data:await r.json()}:null}catch{return null}}));if(id!==searchId)return;const entries=payloads.filter(Boolean).flatMap(p=>entriesFrom(p.data,word,p.edition));const exact=entries.filter(e=>String(e.lang_code||'de').toLowerCase()==='de'||String(e.lang||'').toLowerCase()==='german'||!e.lang_code);results.innerHTML=await render(exact,word)}catch(err){if(id===searchId)results.innerHTML='<div class="panel muted">Dictionary service is temporarily unavailable. Please try again shortly.</div>'}finally{if(id===searchId)button.disabled=false}});
</script></body></html>
