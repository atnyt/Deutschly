<script>
(function(){const t=document.getElementById('menuTrigger'),d=document.getElementById('menuDrawer'),b=document.getElementById('menuBackdrop'),c=document.getElementById('menuClose');function s(o){d.hidden=!o;b.hidden=!o;t.setAttribute('aria-expanded',String(o));}t.addEventListener('click',()=>s(d.hidden));c.addEventListener('click',()=>s(false));b.addEventListener('click',()=>s(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')s(false);});})();
(function(){
const form=document.getElementById('conjugationForm');
const input=document.getElementById('conjugationInput');
const button=document.getElementById('conjugationButton');
const status=document.getElementById('engineStatus');
const output=document.getElementById('conjugationOutput');
let enginePromise;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getEngine(){
 if(!enginePromise)enginePromise=import('./vendor/ablaut/ablaut.js').then(async m=>{await m.default();return m;});
 return enginePromise;
}
function renderTable(t){
 const labels=['ich','du','er/sie/es','wir','ihr','sie'];
 const bn=['আমি','তুমি','সে','আমরা','তোমরা','তারা'];
 const groups=[['Präsens','present'],['Präteritum','preterite'],['Perfekt','perfect'],['Plusquamperfekt','pluperfect'],['Futur I','future1'],['Futur II','future2'],['Konjunktiv I','konjunktiv1'],['Konjunktiv II','konjunktiv2']];
 const cards=groups.map(([title,key])=>'<article class="tense-card"><h3>'+title+'</h3><div class="tense-table-wrap"><table class="tense-table"><tbody>'+t[key].map((form,i)=>'<tr><td>'+bn[i]+' · '+labels[i]+'</td><td>'+esc(form)+'</td></tr>').join('')+'</tbody></table></div></article>').join('');
 const imp=t.imperative&&t.imperative.some(Boolean)?'<div class="conjugation-meta">Imperativ: du — '+esc(t.imperative[0]||'—')+' · ihr — '+esc(t.imperative[1]||'—')+' · Sie — '+esc(t.imperativeExtended[1])+'</div>':'<div class="conjugation-meta">Imperativ: নেই (Modalverb হলে এটি স্বাভাবিক)</div>';
 output.innerHTML='<div><div class="conjugation-heading">'+esc(t.infinitive)+'</div><div class="conjugation-meta">Hilfsverb: <b>'+esc(t.auxiliary)+'</b> · Partizip II: <b>'+esc(t.pastParticiple)+'</b> · zu-Infinitiv: <b>'+esc(t.zuInfinitive)+'</b></div>'+imp+'</div>'+cards+'';
 output.hidden=false;
}
async function run(word){
 word=String(word||'').trim();
 if(!word)return;
 input.value=word;
 button.disabled=true;
 output.hidden=true;
 status.textContent='Conjugation তৈরি হচ্ছে…';
 try{
  const engine=await getEngine();
  const table=engine.conjugate(word);
  renderTable(table);
  status.textContent='রূপ তৈরি হয়েছে। নিচে সব প্রধান Tense ও Mood দেখানো হয়েছে।';
  output.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(error){
  output.innerHTML='<div class="conjugation-error">এই Infinitiv-এর Conjugation তৈরি করা যায়নি। বানান যাচাই করো এবং Infinitiv দাও (যেমন: ging নয়, gehen)।<br><small>'+esc(error&&error.message?error.message:'Unknown error')+'</small></div>';
  output.hidden=false;
  status.textContent='এই শব্দের রূপ পাওয়া যায়নি।';
 }finally{button.disabled=false;}
}
form.addEventListener('submit',e=>{e.preventDefault();run(input.value);});

getEngine().catch(()=>{});
})();

</script>
<script>
(function(){const box=document.getElementById('pdfVerbList'),input=document.getElementById('pdfFilter'),count=document.getElementById('pdfCount');if(!box||!input||!count)return;let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let conjugatorPromise;
async function getPresentForms(word){try{if(!conjugatorPromise)conjugatorPromise=import('./vendor/ablaut/ablaut.js').then(async m=>{await m.default();return m;});const m=await conjugatorPromise;const result=m.conjugate(word);return Array.isArray(result.present)?result.present:null;}catch(_){return null;}}
function regularPresent(word){let stem=word.replace(/en$/,'').replace(/n$/,'');let ich=stem+'e',du,er=stem+'t',wir=stem+'en',ihr=stem+'t',sie=stem+'en';if(stem.endsWith('eln')){ich=stem.slice(0,-1)+'e';du=stem+'st';er=stem+'t';ihr=stem+'t';}else{const needsE=/[dtt]$/.test(stem)||(/[mn]$/.test(stem)&&/[bcdfghklmpqrstvwxyz][mn]$/.test(stem));du=stem+(needsE?'e':'')+(/[szßxz]$/.test(stem)?'t':'st');er=stem+(needsE?'e':'')+'t';ihr=er;}return [ich,du,er,wir,ihr,sie];}
async function render(){const q=input.value.trim().toLocaleLowerCase();const found=rows.filter(v=>[v.infinitive,v.meaningBn,v.prateritum,v.partizipII].join(' ').toLocaleLowerCase().includes(q));count.textContent=found.length+' / '+rows.length+'টি ক্রিয়া';const labels={'strong':'শক্তিশালী','weak':'দুর্বল/নিয়মিত','mixed':'মিশ্র','modal':'Modalverb','dual-strong-weak':'শক্তিশালী ও দুর্বল—দুই রূপ','irregular-suppletive':'বিশেষ অনিয়মিত'};const cards=await Promise.all(found.map(async v=>{const forms=await getPresentForms(v.infinitive);const regular=regularPresent(v.infinitive);const extraLabels=['ich','wir','ihr','Sie'];const extraIndexes=[0,3,4,5];const extras=forms?extraIndexes.filter(i=>forms[i]&&forms[i]!==regular[i]).map(i=>'<span><b>'+extraLabels[extraIndexes.indexOf(i)]+':</b> '+esc(forms[i])+'</span>').join(''):'';return '<article class="pdf-verb-item"><header><strong>'+esc(v.sourceId)+'. '+esc(v.infinitive)+'</strong><small>'+esc(labels[v.classification]||v.classification)+'</small></header><p>'+esc(v.meaningBn||'অর্থ যাচাই বাকি')+'</p><p><b>du:</b> '+esc(v.presentDu||'—')+' &nbsp; <b>er/sie/es:</b> '+esc(v.presentErSieEs||'—')+'</p>'+(extras?'<div class="past exceptional-forms">'+extras+'</div>':'')+'<div class="past"><span>Präteritum: <b>'+esc(v.prateritum||'—')+'</b></span><span>Partizip II: <b>'+esc(v.partizipII||'—')+'</b></span></div><p><b>Perfekt-এর সহায়ক ক্রিয়া:</b> '+esc(v.perfektAuxiliary||'যাচাই বাকি')+'</p>'+(v.auxiliaryNoteBn?'<p class="verb-note"><b>সহায়ক ক্রিয়ার ব্যবহার:</b> '+esc(v.auxiliaryNoteBn)+'</p>':'')+(v.sourceExampleDe?'<div class="verb-note"><b>উদাহরণ:</b> '+esc(v.sourceExampleDe)+(v.sourceExampleBn?'<br>'+esc(v.sourceExampleBn):'')+'</div>':'')+(v.notes?'<p class="verb-note"><b>ব্যবহার:</b> '+esc(v.notes)+'</p>':'')+'<p><button type="button" data-conjugate="'+esc(v.infinitive)+'">পূর্ণ রূপ দেখো ↑</button></p></article>';}));box.innerHTML=cards.join('')||'<div class="empty">কোনো ক্রিয়া পাওয়া যায়নি।</div>';box.querySelectorAll('[data-conjugate]').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById('conjugationInput');if(i){i.value=b.dataset.conjugate;document.getElementById('conjugationForm').requestSubmit();window.scrollTo({top:0,behavior:'smooth'});}}));}fetch('./data/irregular-verbs-pdf-241.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('catalog unavailable');return r.json();}).then(d=>{rows=d.records||[];render();}).catch(()=>{count.textContent='তালিকা লোড হয়নি';box.textContent='PDF তালিকা লোড করা যায়নি।';});input.addEventListener('input',render);})();
</script></body></html>
