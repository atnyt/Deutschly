<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>German Pronunciation Verifier</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#000;color:#f5f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
main{width:min(100%,620px);margin:clamp(20px,7vh,68px) auto 0}
form{display:flex;align-items:center;gap:10px;width:100%}
input{flex:1;min-width:0;height:56px;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:0 18px;font-size:16px;outline:none;background:rgba(255,255,255,.065);color:#f7f7f9;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .18s,background .18s,box-shadow .18s}
input:focus{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px rgba(255,255,255,.035)}
input::placeholder{color:#85858c}
input::-webkit-search-cancel-button{filter:grayscale(1)}
button{width:56px;height:56px;flex:0 0 56px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .18s,border-color .18s}
button:active{background:rgba(255,255,255,.2)}
button:focus-visible,input:focus-visible{outline:2px solid rgba(255,255,255,.65);outline-offset:3px}
button:disabled{opacity:.55;cursor:wait}
svg{width:22px;height:22px}
.results{margin-top:18px;display:grid;gap:10px}
.card{border:1px solid rgba(255,255,255,.10);border-radius:15px;padding:15px 16px;text-decoration:none;color:#f5f5f7;display:block;background:#080808;transition:background .18s,border-color .18s}
.card:active{background:#111}
.card.featured{padding:19px 18px;border-color:rgba(180,195,255,.30);background:linear-gradient(135deg,rgba(120,140,205,.16),rgba(255,255,255,.055) 55%,rgba(120,140,205,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 34px rgba(0,0,0,.45),0 0 24px rgba(115,135,220,.055);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.card.featured strong{font-size:16px}
.card.featured .tag{display:inline-block;width:max-content;margin:0 0 9px;padding:4px 8px;border:1px solid rgba(190,202,255,.22);border-radius:999px;color:#c7d0ff;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.card.featured:active{background:rgba(100,120,190,.18)}
.card strong{display:block;font-size:15px;font-weight:650;margin-bottom:6px;letter-spacing:.005em}
.card span{display:block;color:#a7a7b0;font-size:13px;line-height:1.5}
.status{font-size:13px;color:#a7a7b0;margin:0 0 5px;line-height:1.6}
.dictionary{margin-bottom:8px;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025))}
.dict-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.dict-head h2{font-size:17px;margin:0;font-weight:650}
.dict-head small,.source-note{color:#9999a4;font-size:11px;line-height:1.5}
.entry-group{padding:12px 0;border-top:1px solid rgba(255,255,255,.10)}
.entry-group:first-of-type{border-top:0}
.pos{font-size:11px;color:#c7d0ff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.sense{margin:8px 0 0;padding-left:10px;border-left:2px solid rgba(190,202,255,.22)}
.sense strong{display:block;font-size:14px;line-height:1.55;font-weight:550}
.sense p{font-size:12px;color:#b0b0ba;line-height:1.55;margin:4px 0 0}
.sense .bn{color:#f2f2f5;font-size:13px}
.source-note{margin:12px 0 0}
.loading-state{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px 0;color:#bfc3d5;font-size:14px}
.audio-card{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 13px;border:1px solid rgba(180,195,255,.24);border-radius:16px;background:linear-gradient(135deg,rgba(120,140,205,.13),rgba(255,255,255,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.audio-play{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border:0;border-radius:50%;background:#c4caff;color:#111321;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.audio-play svg{width:19px;height:19px}
.audio-track{flex:1;min-width:0}
.audio-wave{height:27px;display:flex;align-items:center;justify-content:space-between;gap:2px;overflow:hidden;opacity:.82}
.audio-wave i{display:block;width:3px;min-width:2px;height:var(--h);border-radius:4px;background:#b9bfff;transform:scaleY(.55);transform-origin:center;transition:transform .15s}
.audio-card.is-playing .audio-wave i{animation:waveBounce .72s ease-in-out infinite alternate;animation-delay:var(--d)}
.audio-card.is-playing .audio-wave i:nth-child(3n){animation-duration:.53s}
.audio-card.is-playing .audio-wave i:nth-child(4n){animation-duration:.9s}
@keyframes waveBounce{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.audio-meta{display:flex;align-items:center;gap:8px;margin-top:7px}
.audio-time{font-size:11px;color:#a7a7b0;font-variant-numeric:tabular-nums;white-space:nowrap}
.audio-seek{width:100%;height:4px;margin:0;accent-color:#c4caff;cursor:pointer}
.audio-error{font-size:11px;color:#b8b8c2;margin-top:5px}
@media(prefers-reduced-motion:reduce){.audio-card.is-playing .audio-wave i{animation:none;transform:scaleY(.7)}}
.loading-spinner{position:relative;display:block;width:36px;height:36px;flex:0 0 36px;animation:loadingTurn 1s steps(12) infinite}
.loading-spinner i{position:absolute;left:16px;top:1px;width:4px;height:10px;border-radius:4px;background:#a7b5ff;transform-origin:2px 17px}
@keyframes loadingTurn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loading-spinner{animation-duration:2.5s}}
.hidden{display:none}
@media(max-width:420px){body{padding-left:16px;padding-right:16px}form{gap:8px}input,button{height:54px}button{width:54px;flex-basis:54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.corner-brand{display:inline-flex;align-items:center;gap:8px;max-width:78%;padding:9px 14px;border:1px solid rgba(190,202,255,.18);border-radius:12px;background:linear-gradient(120deg,rgba(130,150,255,.045),rgba(255,255,255,.018));box-shadow:0 0 2px rgba(110,130,255,.015),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:13px;font-weight:650;letter-spacing:.075em;text-transform:uppercase;color:#dce1ff}.corner-brand:before{content:"";width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#b8c5ff;box-shadow:none}@keyframes brandGlow{0%,100%{box-shadow:0 0 1px rgba(110,130,255,.01),inset 0 1px 0 rgba(255,255,255,.035)}50%{box-shadow:0 0 2px rgba(110,130,255,.015),inset 0 1px 0 rgba(255,255,255,.04)}}@media(prefers-reduced-motion:reduce){.corner-brand{animation:none}}
</style>
</head>
<body>
<main>
<nav style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px"><span class="corner-brand">Pronunciation Verifier</span><a href="./dictionary.html" style="color:#c7d0ff;text-decoration:none;border:1px solid rgba(190,202,255,.24);background:rgba(120,140,205,.09);border-radius:999px;padding:9px 14px;font-size:13px">Dictionary →</a></nav>
<form id="searchForm" role="search">
<input id="word" name="word" type="search" placeholder="Search a German word" aria-label="German word" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="100" required>
<button id="searchButton" type="submit" aria-label="Search">
<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</form>
<section id="results" class="results hidden" aria-live="polite"></section>
</main>
<script>
'use strict';
const form=document.getElementById('searchForm');
const input=document.getElementById('word');
const button=document.getElementById('searchButton');
const results=document.getElementById('results');
let activeSearch=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(url,title,detail,featured=false){return '<a class="card'+(featured?' featured':'')+'" href="'+url+'" target="_blank" rel="noopener noreferrer">'+(featured?'<span class="tag">Best match</span>':'')+'<strong>'+esc(title)+'</strong><span>'+esc(detail)+'</span></a>'}
function otherSites(word){const q=encodeURIComponent(word);return [card('https://www.duden.de/suchen/dudenonline/'+q,'Duden','German dictionary · Check the entry for an audio icon.'),card('https://de.pons.com/übersetzung/deutsch-englisch/'+q,'PONS','Dictionary · Check the matching German entry.'),card('https://forvo.com/word/'+q+'/#de','Forvo','Native-speaker recordings · Availability depends on the word.')].join('')}
function posLabel(pos){return ({noun:'Noun · বিশেষ্য',verb:'Verb · ক্রিয়া',adjective:'Adjective · বিশেষণ',adverb:'Adverb · ক্রিয়া বিশেষণ',preposition:'Preposition · পদান্বয়ী অব্যয়',pronoun:'Pronoun · সর্বনাম',conjunction:'Conjunction · যোজক',interjection:'Interjection · আবেগসূচক শব্দ',particle:'Particle · অব্যয়'}[String(pos||'').toLowerCase()]||String(pos||'Word class not specified'))}
function collectBengaliTranslations(value,out=[],seen=new Set()){
 if(!value)return out;
 if(Array.isArray(value)){value.forEach(v=>collectBengaliTranslations(v,out,seen));return out}
 if(typeof value!=='object')return out;
 const code=String(value.lang_code||value.code||value.language_code||'').toLowerCase();
 const lang=String(value.lang||value.language||'').toLowerCase();
 const isBn=code==='bn'||code==='ben'||lang==='bengali'||lang==='bangla';
 if(isBn){
  const word=String(value.word||value.translation||value.term||value.text||'').trim();
  if(word&&!seen.has(word)){seen.add(word);out.push(word)}
 }
 Object.entries(value).forEach(([k,v])=>{if(k!=='translations')collectBengaliTranslations(v,out,seen)});
 return out;
}
function renderDictionary(entries,word){
 const groups=[];const groupSeen=new Set();
 const wordTranslations=collectBengaliTranslations(entries.flatMap(entry=>entry.translations||[]));
 entries.forEach(entry=>{
  const pos=String(entry.pos||'').toLowerCase();
  const key=pos||'unknown';
  let group=groups.find(g=>g.key===key);
  if(!group){group={key,pos,label:posLabel(pos),senses:[],seen:new Set()};groups.push(group)}
  (Array.isArray(entry.senses)?entry.senses:[]).forEach(sense=>{
   const glossSource=Array.isArray(sense.glosses)&&sense.glosses.length?sense.glosses:sense.raw_glosses;
   const glosses=Array.isArray(glossSource)?glossSource.filter(x=>typeof x==='string'&&x.trim()):[];
   const glossKey=glosses.join('|').toLowerCase();
   if(!glosses.length||group.seen.has(glossKey))return;
   group.seen.add(glossKey);
   const bn=collectBengaliTranslations(sense.translations||sense.translation||[]);
   group.senses.push({glosses,bn,examples:Array.isArray(sense.examples)?sense.examples:[]});
  });
 });
 const hasAny=groups.some(g=>g.senses.length);
 if(!hasAny)return '';
 return '<section class="dictionary"><div class="dict-head"><h2>'+esc(word)+'</h2><small>Dictionary meanings</small></div>'+(wordTranslations.length?'<div class="entry-group"><div class="pos">Bengali translations found</div><p class="bn">'+esc(wordTranslations.join(' · '))+'</p><p class="source-note">These are word-level translations; they may not match every sense one-to-one.</p></div>':'')+
 groups.filter(g=>g.senses.length).map(g=>'<div class="entry-group"><div class="pos">'+esc(g.label)+'</div>'+
 g.senses.map((s,i)=>'<div class="sense"><strong>'+esc((i+1)+'. '+s.glosses[0])+'</strong>'+
 (s.bn.length?'<p class="bn">বাংলা: '+esc(s.bn.join(' · '))+'</p>':'<p>বাংলা অনুবাদ এই উৎসে পাওয়া যায়নি; উপরের সংজ্ঞাটি মূল অভিধানের ভাষায় দেওয়া হয়েছে।</p>')+
 (s.glosses.length>1?'<p>Other definitions: '+esc(s.glosses.slice(1).join('; '))+'</p>':'')+
 (s.examples.length?'<p>Example: '+esc(typeof s.examples[0]==='string'?s.examples[0]:(s.examples[0].text||s.examples[0].example||''))+'</p>':'')+'</div>').join('')+'</div>').join('')+
 '<p class="source-note">Meanings are taken from Wiktionary data. Coverage and Bengali translations vary by word; missing translations are not guessed.</p></section>';
}
function hasAudioReference(value,key=''){
 if(value==null)return false;
 if(typeof value==='string'){
  const s=value.trim();
  if(!s)return false;
  const audioKey=/audio|sound|file|ogg|mp3|wav|opus/i.test(key);
  const lower=s.toLowerCase();
  const looksLikeAudio=lower.endsWith('.ogg')||lower.endsWith('.oga')||lower.endsWith('.mp3')||lower.endsWith('.wav')||lower.endsWith('.opus')||lower.includes('.ogg?')||lower.includes('.mp3?')||lower.startsWith('http://')||lower.startsWith('https://')||lower.startsWith('file:')||lower.startsWith('audio:');
  return audioKey&&looksLikeAudio;
 }
 if(Array.isArray(value))return value.some(item=>hasAudioReference(item,key));
 if(typeof value==='object')return Object.entries(value).some(([k,v])=>hasAudioReference(v,k));
 return false;
}
function wiktionaryUrl(word){return 'https://de.wiktionary.org/wiki/'+encodeURIComponent(word.replace(/ /g,'_'))}
function sourceCards(word){
 const q=encodeURIComponent(word.trim());
 return [
  card(wiktionaryUrl(word),'Wiktionary ↗','Open the German Wiktionary entry.'),
  card('https://www.duden.de/suchen/dudenonline/'+q,'Duden ↗','Open Duden search results for this word.'),
  card('https://de.pons.com/übersetzung/deutsch-englisch/'+q,'PONS ↗','Open PONS dictionary results for this word.'),
  card('https://forvo.com/word/'+q+'/#de','Forvo ↗','Open German speaker recordings for this word.')
 ].join('');
}
function audioPlayer(url,index){
 const safe=esc(url);
 const bars=Array.from({length:34},(_,i)=>'<i style="--h:'+([7,12,17,10,21,14,8,18,24,12,16,9,22,13,7,19,25,11,16,8,20,14,23,10,17,7,13,21,9,18,12,24,15,8][i%34])+'px;--d:'+((i%9)*-.07)+'s"></i>').join('');
 return '<section class="audio-card" data-audio-card><button class="audio-play" type="button" aria-label="Play pronunciation" data-play><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg></button><div class="audio-track"><div class="audio-wave" aria-hidden="true">'+bars+'</div><div class="audio-meta"><span class="audio-time" data-time>0:00 / --:--</span><input class="audio-seek" type="range" min="0" max="1000" value="0" aria-label="Seek audio" data-seek></div><audio preload="none" src="'+safe+'"></audio><div class="audio-error hidden" data-error>Audio could not be loaded.</div></div></section>';
}
function setupAudioPlayers(){
 results.querySelectorAll('[data-audio-card]').forEach(card=>{
  const audio=card.querySelector('audio'),play=card.querySelector('[data-play]'),seek=card.querySelector('[data-seek]'),time=card.querySelector('[data-time]'),error=card.querySelector('[data-error]');
  const fmt=n=>{if(!Number.isFinite(n)||n<0)return '--:--';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')};
  const paint=()=>{
   const duration=audio.duration;
   time.textContent=fmt(audio.currentTime)+' / '+fmt(duration);
   seek.value=duration>0?String(Math.round(audio.currentTime/duration*1000)):'0';
   seek.disabled=!(duration>0);
  };
  play.addEventListener('click',async()=>{
   if(audio.paused){try{await audio.play()}catch(e){error.classList.remove('hidden')}}else audio.pause();
  });
  audio.addEventListener('play',()=>{card.classList.add('is-playing');play.setAttribute('aria-label','Pause pronunciation');play.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM14 5h4v14h-4z" fill="currentColor"/></svg>'});
  audio.addEventListener('pause',()=>{card.classList.remove('is-playing');play.setAttribute('aria-label','Play pronunciation');play.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>'});
  audio.addEventListener('timeupdate',paint);audio.addEventListener('loadedmetadata',paint);audio.addEventListener('durationchange',paint);
  audio.addEventListener('ended',()=>{audio.currentTime=0;paint()});
  audio.addEventListener('error',()=>error.classList.remove('hidden'));
  seek.addEventListener('input',()=>{if(audio.duration>0)audio.currentTime=(Number(seek.value)/1000)*audio.duration});
  paint();
 });
}
async function wiktionaryPage(word){
 const url='https://de.wiktionary.org/w/api.php?action=parse&page='+encodeURIComponent(word.replace(/ /g,'_'))+'&prop=text&format=json&origin=*';
 const response=await fetch(url,{headers:{Accept:'application/json'}});
 if(!response.ok)throw new Error('Wiktionary request failed');
 const data=await response.json();
 if(data.error||!data.parse||!data.parse.text||!data.parse.text['*'])return null;
 const html=data.parse.text['*'];
 const doc=new DOMParser().parseFromString(html,'text/html');
 const candidates=[];
 doc.querySelectorAll('audio[src],audio source[src],a[href]').forEach(el=>{
  const raw=el.getAttribute('src')||el.getAttribute('href')||'';
  const absolute=raw.startsWith('//')?'https:'+raw:raw;
  if(/^https?:\/\//i.test(absolute)&&/upload\.wikimedia\.org/i.test(absolute)&&/\.(ogg|oga|mp3|wav|opus)(?:[?#].*)?$/i.test(absolute))candidates.push(absolute);
 });
 return {html,hasEntry:!!doc.body.textContent.trim(),audio:[...new Set(candidates)]};
}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const requestId=++activeSearch;
 const word=input.value.trim().replace(/\s+/g,' ');
 if(!word){input.focus();return}
 button.disabled=true;
 results.classList.remove('hidden');
 results.innerHTML='<div class="loading-state" role="status"><span class="loading-spinner" aria-hidden="true">'+Array.from({length:12},(_,i)=>'<i style="transform:rotate('+(i*30)+'deg);opacity:'+((i+1)/12)+'"></i>').join('')+'</span><span>Searching Wiktionary for a real entry and audio…</span></div>';
 try{
  let page=null;
  try{page=await wiktionaryPage(word)}catch(error){page=null}
  if(requestId!==activeSearch)return;
  let audioHtml='';
  let status='';
  if(page&&page.audio.length){
   audioHtml=page.audio.map(audioPlayer).join('');
   status='';
  }else if(page){
   status='';
  }else{
   status='';
  }
  results.innerHTML=audioHtml+status+sourceCards(word);
  setupAudioPlayers();
 }catch(error){
  if(requestId===activeSearch)results.innerHTML=sourceCards(word);
 }finally{
  if(requestId===activeSearch)button.disabled=false;
 }
});
</script>
</body>
</html>
