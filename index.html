<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>German Pronunciation Verifier</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#000;color:#f5f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
main{width:min(100%,620px);margin:clamp(20px,7vh,68px) auto 0}
form{display:flex;align-items:center;gap:10px;width:100%}
input{flex:1;min-width:0;height:56px;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:0 18px;font-size:16px;outline:none;background:rgba(255,255,255,.065);color:#f7f7f9;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .18s,background .18s,box-shadow .18s}
input:focus{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px rgba(255,255,255,.035)}
input::placeholder{color:#85858c}
input::-webkit-search-cancel-button{filter:grayscale(1)}
button{width:56px;height:56px;flex:0 0 56px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .18s,border-color .18s}
button:active{background:rgba(255,255,255,.2)}
button:focus-visible,input:focus-visible{outline:2px solid rgba(255,255,255,.65);outline-offset:3px}
svg{width:22px;height:22px}
.results{margin-top:18px;display:grid;gap:10px}
.card{border:1px solid rgba(255,255,255,.12);border-radius:17px;padding:16px 17px;text-decoration:none;color:#f5f5f7;display:block;background:rgba(255,255,255,.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .18s,border-color .18s}
.card:active{background:rgba(255,255,255,.09)}
.card strong{display:block;font-size:15px;font-weight:650;margin-bottom:6px;letter-spacing:.005em}
.card span{display:block;color:#a7a7b0;font-size:13px;line-height:1.5}
.status{font-size:13px;color:#a7a7b0;margin:0 0 5px;line-height:1.6}
.hidden{display:none}
@media(max-width:420px){body{padding-left:16px;padding-right:16px}form{gap:8px}input,button{height:54px}button{width:54px;flex-basis:54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<form id="searchForm" role="search">
<input id="word" name="word" type="search" placeholder="Deutsches Wort suchen" aria-label="Deutsches Wort" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="100" required>
<button type="submit" aria-label="Suchen">
<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</form>
<section id="results" class="results hidden" aria-live="polite"></section>
</main>
<script>
'use strict';
const form=document.getElementById('searchForm');
const input=document.getElementById('word');
const results=document.getElementById('results');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(url,title,detail){return '<a class="card" href="'+url+'" target="_blank" rel="noopener noreferrer"><strong>'+esc(title)+'</strong><span>'+esc(detail)+'</span></a>'}
function showLinks(word,message){
 const q=encodeURIComponent(word);
 results.innerHTML='<p class="status">'+esc(message)+'</p>'+
 card('https://www.duden.de/suchen/dudenonline/'+q,'Duden','Offizielle Wörterbuchsuche · Audio auf der Eintragsseite prüfen')+
 card('https://de.pons.com/übersetzung/deutsch-englisch/'+q,'PONS','Offizielle Wörterbuchsuche · Audio auf der Eintragsseite prüfen')+
 card('https://de.wiktionary.org/wiki/'+q,'Wiktionary','Direkter Eintrag · Audio auf der Eintragsseite prüfen');
 results.classList.remove('hidden');
}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const word=input.value.trim().replace(/\s+/g,' ');
 if(!word){input.focus();return}
 results.classList.remove('hidden');
 results.innerHTML='';
 const loading=document.createElement('p');loading.className='status';loading.textContent='Suche nach einem passenden Wörterbucheintrag …';results.appendChild(loading);
 try{
  const api='https://de.wiktionary.org/w/api.php?action=parse&page='+encodeURIComponent(word)+'&prop=wikitext%7Cdisplaytitle&format=json&origin=*';
  const response=await fetch(api,{headers:{Accept:'application/json'}});
  if(!response.ok)throw new Error('lookup failed');
  const data=await response.json();
  if(data.error||!data.parse||data.parse.title.toLocaleLowerCase('de-DE')!==word.toLocaleLowerCase('de-DE')){
   showLinks(word,'Kein exakt passender Wiktionary-Eintrag bestätigt. Hier sind offizielle Wörterbuchsuchen; prüfe den exakten Eintrag und das Lautsprecher-Symbol.');
   return;
  }
  const wikitext=typeof data.parse.wikitext==='string'?data.parse.wikitext:(data.parse.wikitext&&data.parse.wikitext['*'])||'';
  const audioPattern=/(?:\[\[(?:Datei|File):|\{\{(?:Audio|audio|Aussprache|Hörbeispiel)\s*\|\s*)([^\]|}]+\.(?:ogg|oga|mp3|wav))/i;
  const audioMatch=audioPattern.test(wikitext);
  if(audioMatch){
   results.innerHTML='<p class="status">Exakter Eintrag gefunden; ein Audio-Verweis wurde erkannt.</p>'+
    card('https://de.wiktionary.org/wiki/'+encodeURIComponent(data.parse.title),'Wiktionary · Audio-Verweis gefunden','Exakter Wörterbucheintrag · Öffne die Seite zum Anhören')+
    card('https://www.duden.de/suchen/dudenonline/'+encodeURIComponent(word),'Duden','Offizielle Wörterbuchsuche · Audio nicht automatisch geprüft')+
    card('https://de.pons.com/übersetzung/deutsch-englisch/'+encodeURIComponent(word),'PONS','Offizielle Wörterbuchsuche · Audio nicht automatisch geprüft');
  }else{
   showLinks(word,'Exakter Wiktionary-Eintrag gefunden, aber Audio konnte nicht bestätigt werden. Prüfe diese Wörterbuchseiten direkt.');
  }
 }catch(error){
  showLinks(word,'Die automatische Prüfung ist momentan nicht erreichbar. Prüfe bei einem Wörterbucheintrag, ob ein Lautsprecher-Symbol vorhanden ist.');
 }
});
</script>
</body>
</html>
