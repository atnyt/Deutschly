<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>German Pronunciation Verifier</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#000;color:#f5f5f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
main{width:min(100%,620px);margin:clamp(20px,7vh,68px) auto 0}
form{display:flex;align-items:center;gap:10px;width:100%}
input{flex:1;min-width:0;height:56px;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:0 18px;font-size:16px;outline:none;background:rgba(255,255,255,.065);color:#f7f7f9;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .18s,background .18s,box-shadow .18s}
input:focus{border-color:rgba(255,255,255,.34);background:rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 3px rgba(255,255,255,.035)}
input::placeholder{color:#85858c}
input::-webkit-search-cancel-button{filter:grayscale(1)}
button{width:56px;height:56px;flex:0 0 56px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:background .18s,border-color .18s}
button:active{background:rgba(255,255,255,.2)}
button:focus-visible,input:focus-visible{outline:2px solid rgba(255,255,255,.65);outline-offset:3px}
button:disabled{opacity:.55;cursor:wait}
svg{width:22px;height:22px}
.results{margin-top:18px;display:grid;gap:10px}
.card{border:1px solid rgba(255,255,255,.12);border-radius:17px;padding:16px 17px;text-decoration:none;color:#f5f5f7;display:block;background:rgba(255,255,255,.045);box-shadow:inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .18s,border-color .18s}
.card:active{background:rgba(255,255,255,.09)}
.card strong{display:block;font-size:15px;font-weight:650;margin-bottom:6px;letter-spacing:.005em}
.card span{display:block;color:#a7a7b0;font-size:13px;line-height:1.5}
.status{font-size:13px;color:#a7a7b0;margin:0 0 5px;line-height:1.6}
.hidden{display:none}
@media(max-width:420px){body{padding-left:16px;padding-right:16px}form{gap:8px}input,button{height:54px}button{width:54px;flex-basis:54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<form id="searchForm" role="search">
<input id="word" name="word" type="search" placeholder="Search a German word" aria-label="German word" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="100" required>
<button id="searchButton" type="submit" aria-label="Search">
<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</form>
<section id="results" class="results hidden" aria-live="polite"></section>
</main>
<script>
'use strict';
const form=document.getElementById('searchForm');
const input=document.getElementById('word');
const button=document.getElementById('searchButton');
const results=document.getElementById('results');
let activeSearch=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(url,title,detail){return '<a class="card" href="'+url+'" target="_blank" rel="noopener noreferrer"><strong>'+esc(title)+'</strong><span>'+esc(detail)+'</span></a>'}
function fallbackLinks(word,message){
 const q=encodeURIComponent(word);
 results.innerHTML='<p class="status">'+esc(message)+'</p>'+
 card('https://www.duden.de/suchen/dudenonline/'+q,'Duden','Dictionary search · Check the exact entry and speaker icon')+
 card('https://de.pons.com/übersetzung/deutsch-englisch/'+q,'PONS','Dictionary search · Check the exact entry and speaker icon')+
 card('https://de.wiktionary.org/wiki/'+q,'Wiktionary','Open entry directly · Audio is not verified');
 results.classList.remove('hidden');
}
function hasAudioReference(value,key=''){
 if(value==null)return false;
 if(typeof value==='string'){
  const s=value.trim();
  if(!s)return false;
  const audioKey=/audio|sound|file|ogg|mp3|wav|opus/i.test(key);
  return audioKey&&(/\\.(ogg|oga|mp3|wav|opus)(?:[?#].*)?$/i.test(s)||/^https?:\\/\\//i.test(s)||/^File:/i.test(s)||/^Audio:/i.test(s)||s.length>3);
 }
 if(Array.isArray(value))return value.some(item=>hasAudioReference(item,key));
 if(typeof value==='object')return Object.entries(value).some(([k,v])=>hasAudioReference(v,k));
 return false;
}
function wiktionaryUrl(word){return 'https://de.wiktionary.org/wiki/'+encodeURIComponent(word.replace(/ /g,'_'))}
function dictionaryFallback(word,message){
 const q=encodeURIComponent(word);
 results.innerHTML='<p class="status">'+esc(message)+'</p>'+
 card('https://www.duden.de/suchen/dudenonline/'+q,'Search Duden','Open the dictionary search and verify the exact entry and speaker icon.');
 results.classList.remove('hidden');
}
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const requestId=++activeSearch;
 const word=input.value.trim().replace(/\s+/g,' ');
 if(!word){input.focus();return}
 button.disabled=true;
 results.classList.remove('hidden');
 results.innerHTML='<p class="status">Checking the exact German dictionary entry and audio data…</p>';
 try{
  // Check both editions and their dedicated pronunciation endpoints.
  const encodedWord=encodeURIComponent(word);
  const editions=['en','de'];
  const payloads=await Promise.all(editions.flatMap(edition=>[
   fetch('https://api.wiktapi.dev/v1/'+edition+'/word/'+encodedWord+'?lang=de',{headers:{Accept:'application/json'}})
    .then(async response=>response.ok?await response.json():null).catch(()=>null),
   fetch('https://api.wiktapi.dev/v1/'+edition+'/word/'+encodedWord+'/pronunciations?lang=de',{headers:{Accept:'application/json'}})
    .then(async response=>response.ok?await response.json():null).catch(()=>null)
  ]));
  if(requestId!==activeSearch)return;
  const entries=payloads.flatMap(data=>{
   if(!data)return [];
   if(Array.isArray(data.entries))return data.entries;
   if(Array.isArray(data.pronunciations))return [{word:data.word||word,lang:data.lang||'German',lang_code:data.lang_code||'de',sounds:data.pronunciations}];
   if(typeof data.word==='string')return [data];
   return [];
  });
  const normalizedWord=word.normalize('NFC').toLocaleLowerCase('de-DE');
  const exactEntries=entries.filter(entry=>{
   if(!entry||typeof entry.word!=='string'||entry.word.normalize('NFC').toLocaleLowerCase('de-DE')!==normalizedWord)return false;
   const langCode=String(entry.lang_code||'').toLocaleLowerCase('de-DE');
   const langName=String(entry.lang||'').toLocaleLowerCase('de-DE');
   return langCode==='de'||langCode==='ger'||langName==='german'||langName==='deutsch';
  });
  const audioEntries=exactEntries.filter(entry=>hasAudioReference(entry.sounds||entry.pronunciations||entry,'sounds'));
  if(audioEntries.length){
   results.innerHTML='<p class="status">Exact German entry found. Structured pronunciation data includes an audio reference; open the source entry to listen.</p>'+
    card(wiktionaryUrl(audioEntries[0].word),'Wiktionary · Audio reference found','Exact German entry · Listen on the original page');
  }else if(exactEntries.length){
   dictionaryFallback(word,'Exact German entry found, but no recorded-audio reference was confirmed. Search Duden as the next option; audio is not yet verified.');
  }else{
   dictionaryFallback(word,'No exact German entry was confirmed by the data service. Search Duden directly; this is a fallback, not a verified result.');
  }
 }catch(error){
  if(requestId===activeSearch)fallbackLinks(word,'Automatic audio verification is currently unavailable. Only dictionary search links are shown; audio is not verified.');
 }finally{
  if(requestId===activeSearch)button.disabled=false;
 }
});
</script>
</body>
</html>
