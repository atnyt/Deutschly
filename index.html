<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>German Pronunciation Verifier</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;min-height:100%;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(100%,620px)}
form{display:flex;align-items:center;gap:10px;width:100%}
input{flex:1;min-width:0;height:54px;border:1px solid #d5d5d5;border-radius:14px;padding:0 17px;font-size:16px;outline:none;background:#fff;color:#171717}
input:focus{border-color:#777;box-shadow:0 0 0 3px #0000000b}
input::placeholder{color:#888}
button{width:54px;height:54px;flex:0 0 54px;border:0;border-radius:14px;background:#171717;color:white;display:grid;place-items:center;cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid #999;outline-offset:3px}
svg{width:22px;height:22px}
@media(max-width:420px){form{gap:8px}input{height:50px;padding:0 13px}button{width:50px;height:50px;flex-basis:50px}}
</style>
</head>
<body>
<main>
<form id="searchForm" role="search">
<input id="word" name="word" type="search" placeholder="জার্মান শব্দ লিখুন..." aria-label="জার্মান শব্দ" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="100" required>
<button type="submit" aria-label="সার্চ করুন" title="সার্চ করুন">
<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</form>
</main>
<script>
'use strict';
const form=document.getElementById('searchForm');
const input=document.getElementById('word');
form.addEventListener('submit',function(event){
 event.preventDefault();
 const word=input.value.trim().replace(/\s+/g,' ');
 if(!word){input.focus();return;}
 const query='"'+word+'" German pronunciation audio (site:duden.de OR site:pons.com OR site:dwds.de OR site:de.wiktionary.org)';
 window.location.href='https://www.google.com/search?q='+encodeURIComponent(query);
});
</script>
</body>
</html>
